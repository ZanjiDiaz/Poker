<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SEVENS</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #1a0a2e;
  --bg2:   #2d1b4e;
  --bg3:   #3d2460;
  --felt:  #0e1f0e;
  --felt2: #142814;
  --neon:  #ff6ac1;
  --cyan:  #00f5ff;
  --yel:   #ffe600;
  --grn:   #39ff14;
  --red:   #ff3131;
  --red2:  #ff7777;
  --dim:   #7a7a9a;
  --whi:   #f0f0f0;
  --cf:    #fff8e7;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  height: 100%;
  height: -webkit-fill-available;
  overflow: hidden;
}
body {
  width: 100%;
  height: 100%;
  height: -webkit-fill-available;
  overflow: hidden;
  background: var(--bg);
  color: var(--whi);
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
}

body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 9998;
  background: repeating-linear-gradient(0deg,
    transparent 0px, transparent 3px,
    rgba(0,0,0,.06) 3px, rgba(0,0,0,.06) 4px);
}

/* ════ SCREENS ════ */
.scr {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  align-items: center;
}
.scr.on { display: flex; }

/* ════ LOBBY ════ */
#s-lobby {
  justify-content: center;
  padding: max(env(safe-area-inset-top),24px) 20px max(env(safe-area-inset-bottom),32px);
  gap: 22px;
  background:
    radial-gradient(ellipse at 30% 70%, rgba(255,106,193,.08) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 30%, rgba(0,245,255,.06) 0%, transparent 50%),
    var(--bg);
}
.logo { text-align: center; }
.logo-ttl {
  font-size: clamp(28px,10vw,52px); color: var(--yel);
  text-shadow: 0 0 14px var(--yel), 4px 4px 0 rgba(0,0,0,.85);
  letter-spacing: 4px;
  animation: glow 2.2s ease-in-out infinite alternate;
}
@keyframes glow {
  from { text-shadow: 0 0 8px var(--yel), 4px 4px 0 rgba(0,0,0,.85); }
  to   { text-shadow: 0 0 30px var(--yel), 0 0 55px rgba(255,230,0,.35), 4px 4px 0 rgba(0,0,0,.85); }
}
.logo-suits { font-family:'VT323',monospace; font-size:22px; color:var(--neon); letter-spacing:10px; margin-top:6px; text-shadow:0 0 8px var(--neon); }
.logo-sub   { font-family:'VT323',monospace; font-size:13px; color:var(--dim); letter-spacing:3px; margin-top:2px; }

.panel {
  width:100%; max-width:360px; padding:22px 18px;
  background:var(--bg2); border:2px solid var(--cyan);
  box-shadow: 5px 5px 0 rgba(0,0,0,.9), 7px 7px 0 var(--cyan);
}
.lbl { font-size:7px; color:var(--cyan); letter-spacing:2px; margin-bottom:6px; display:block; }
.inp {
  width:100%; background:var(--bg); border:2px solid var(--bg3);
  color:var(--yel); font-family:'Press Start 2P',monospace; font-size:9px;
  padding:12px; outline:none; margin-bottom:14px;
  caret-color:var(--yel); -webkit-appearance:none; border-radius:0;
  -webkit-user-select:text; user-select:text;
}
.inp:focus { border-color:var(--cyan); }
.inp::placeholder { color:var(--bg3); font-size:8px; }
.inp.code { text-transform:uppercase; letter-spacing:8px; font-size:16px; text-align:center; color:var(--neon); }

.hdiv { display:flex; align-items:center; gap:10px; margin:10px 0; font-size:7px; color:var(--dim); }
.hdiv::before,.hdiv::after { content:''; flex:1; height:2px; background:var(--bg3); }

.btn {
  display:block; width:100%; padding:14px 10px;
  font-family:'Press Start 2P',monospace; font-size:8px;
  letter-spacing:1px; text-transform:uppercase; border:none;
  cursor:pointer; outline:none; border-radius:0; -webkit-appearance:none;
  touch-action:manipulation; margin-bottom:8px;
  transition:transform .06s, box-shadow .06s;
}
.btn:active  { transform:translate(3px,3px) !important; box-shadow:1px 1px 0 transparent !important; }
.btn-y  { background:var(--yel);  color:#1a0a00;  border:2px solid #c09000; box-shadow:4px 4px 0 #c09000; }
.btn-c  { background:transparent; color:var(--cyan); border:2px solid var(--cyan); box-shadow:4px 4px 0 #006680; }
.btn-n  { background:var(--neon); color:#1a0010;  border:2px solid #aa0080; box-shadow:4px 4px 0 #aa0080; }
.btn-r  { background:transparent; color:var(--red2); border:2px solid #880000; box-shadow:4px 4px 0 #880000; }
.btn-sm { width:auto; display:inline-block; padding:10px 18px; font-size:7px; }

.conn-row { display:flex; align-items:center; gap:8px; font-family:'VT323',monospace; font-size:14px; color:var(--dim); margin-top:14px; }
.dot { width:8px; height:8px; background:var(--red); flex-shrink:0; }
.dot.on { background:var(--grn); box-shadow:0 0 6px var(--grn); }

/* ════ WAITING ════ */
#s-wait {
  justify-content:flex-start; align-items:center;
  padding: max(env(safe-area-inset-top),20px) 16px max(env(safe-area-inset-bottom),32px);
  background:var(--bg);
}
.w-panel {
  width:100%; max-width:380px; padding:18px 16px; margin-top:8px;
  background:var(--bg2); border:2px solid var(--neon);
  box-shadow:5px 5px 0 rgba(0,0,0,.9), 7px 7px 0 var(--neon);
}
.stitle { font-size:8px; color:var(--neon); letter-spacing:3px; text-shadow:0 0 6px var(--neon); margin-bottom:10px; }
.code-box {
  background:var(--bg); border:2px solid var(--yel); box-shadow:3px 3px 0 #c09000;
  padding:12px; text-align:center; margin-bottom:14px;
}
.code-lbl { font-size:6px; color:var(--dim); letter-spacing:4px; margin-bottom:4px; }
.code-val { font-size:clamp(24px,9vw,40px); color:var(--yel); letter-spacing:8px; text-shadow:0 0 14px var(--yel); }
.p-row {
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; margin-bottom:5px;
  background:var(--bg); border:2px solid var(--bg3); font-size:8px;
}
.p-row.on { border-color:rgba(57,255,20,.3); }
.pdot { width:8px; height:8px; background:var(--dim); flex-shrink:0; }
.pdot.on { background:var(--grn); box-shadow:0 0 6px var(--grn); animation:blink 2s infinite; }
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
.htag { margin-left:auto; font-size:6px; color:var(--yel); border:1px solid var(--yel); padding:2px 4px; }

/* ════ GAME SCREEN ════ */
#s-game {
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 50%, var(--felt2) 0%, var(--felt) 100%);
  position: absolute; inset: 0;
  display: none; flex-direction: column; align-items: stretch;
}
#s-game.on { display: flex; }

#s-game::before {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:
    repeating-linear-gradient(0deg, transparent 0, transparent 31px, rgba(0,0,0,.1) 31px, rgba(0,0,0,.1) 32px),
    repeating-linear-gradient(90deg, transparent 0, transparent 31px, rgba(0,0,0,.1) 31px, rgba(0,0,0,.1) 32px);
}

/* Header */
.g-hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding: max(env(safe-area-inset-top),0px) 12px 0;
  padding-top: max(env(safe-area-inset-top, 0px), 6px);
  padding-bottom: 6px;
  background:rgba(0,0,0,.7); border-bottom:2px solid var(--neon);
  position:relative; z-index:10; flex-shrink:0;
}
.g-ttl { font-size:10px; color:var(--yel); text-shadow:0 0 8px var(--yel),2px 2px 0 #805000; letter-spacing:3px; }
.g-right { display:flex; align-items:center; gap:8px; }
.pill { font-family:'VT323',monospace; font-size:15px; padding:2px 8px; border:2px solid var(--cyan); color:var(--cyan); background:rgba(0,245,255,.08); }

/* Opponents strip */
.opp-strip {
  display:flex; gap:7px; padding:7px 10px;
  overflow-x:auto; flex-shrink:0; position:relative; z-index:5;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.opp-strip::-webkit-scrollbar { display:none; }
.opp-block {
  flex-shrink:0; min-width:76px;
  background:rgba(0,0,0,.55); border:2px solid var(--bg3);
  padding:6px 7px; text-align:center;
}
.opp-block.disc { opacity:.4; border-style:dashed; }
.opp-nm { font-family:'VT323',monospace; font-size:13px; color:var(--whi); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:4px; }
.opp-pips { display:flex; justify-content:center; flex-wrap:wrap; gap:2px; margin-bottom:3px; }
.pip { width:10px; height:15px; border:1px solid rgba(192,160,96,.5); background:linear-gradient(160deg,#fff8e7,#f0e0b0); flex-shrink:0; }
.opp-num { font-family:'VT323',monospace; font-size:11px; color:var(--dim); }

/* Table center */
.t-center {
  flex:1; display:flex; align-items:center; justify-content:center;
  gap:20px; padding:6px 12px; position:relative; z-index:5; min-height:0; overflow:hidden;
}

/* Deck */
.deck-wrap { text-align:center; cursor:pointer; flex-shrink:0; }
.deck-stack { position:relative; width:60px; height:86px; margin:0 auto 5px; }
.dss,.dsm,.dst { position:absolute; inset:0; border:2px solid; }
.dss { top:6px; left:5px; background:#060e20; border-color:rgba(0,245,255,.1); }
.dsm { top:3px; left:2px; background:#0d1c3e; border-color:rgba(0,245,255,.2); }
.dst {
  background:linear-gradient(135deg,#162548,#0a1830); border-color:var(--cyan);
  box-shadow:3px 3px 0 #000; display:flex; align-items:center; justify-content:center;
  transition:transform .08s, box-shadow .08s; overflow:hidden;
}
.deck-wrap:active .dst { transform:translate(2px,2px); box-shadow:1px 1px 0 #000; }
.deck-inner {
  width:46px; height:70px; border:1px solid rgba(0,245,255,.2);
  background:
    repeating-linear-gradient(45deg, rgba(0,245,255,.04) 0,rgba(0,245,255,.04) 2px, transparent 2px, transparent 8px),
    repeating-linear-gradient(-45deg, rgba(0,245,255,.04) 0,rgba(0,245,255,.04) 2px, transparent 2px, transparent 8px);
  display:flex; align-items:center; justify-content:center;
  font-family:'VT323',monospace; font-size:24px; color:rgba(0,245,255,.35);
}
.deck-badge {
  position:absolute; top:-8px; right:-8px;
  background:var(--neon); color:#1a0010; font-size:6px; padding:2px 4px;
  border:1px solid #aa0080; box-shadow:2px 2px 0 #aa0080; min-width:18px; text-align:center;
}
.deck-empty-box {
  width:60px; height:86px; border:2px dashed rgba(0,245,255,.2);
  display:flex; align-items:center; justify-content:center; margin:0 auto 5px;
}
.deck-empty-box span { font-family:'VT323',monospace; font-size:11px; color:var(--dim); }
.deck-lbl { font-size:6px; color:var(--cyan); letter-spacing:2px; }

/* Action buttons */
.act-btns { display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
.abtn {
  font-family:'Press Start 2P',monospace; font-size:7px; letter-spacing:1px;
  text-transform:uppercase; padding:10px 12px; border:none; cursor:pointer;
  outline:none; -webkit-appearance:none; border-radius:0; touch-action:manipulation;
  white-space:nowrap; transition:transform .06s, box-shadow .06s;
}
.abtn:active { transform:translate(2px,2px) !important; box-shadow:1px 1px 0 transparent !important; }
.abtn-win  { background:var(--yel);  color:#1a0a00; border:2px solid #c09000; box-shadow:3px 3px 0 #c09000; }
.abtn-exit { background:transparent; color:var(--red2); border:2px solid #880000; box-shadow:3px 3px 0 #880000; }

/* ════ CHAT BAR — sits between table & hand, NOT floating ════ */
#chat-bar {
  position: relative; z-index: 20;
  background: rgba(8,5,20,.98);
  border-top: 2px solid var(--bg3);
  flex-shrink: 0;
  display: none;
}
#chat-bar.show { display: block; }

.chat-hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding: 7px 12px; background: var(--bg3);
  font-size:7px; letter-spacing:2px; color:var(--cyan);
  cursor:pointer; touch-action:manipulation; flex-shrink:0;
}

.chat-body {
  overflow: hidden;
  max-height: 0;
  transition: max-height .2s ease;
  display: flex; flex-direction: column;
}
.chat-body.open { max-height: 34vh; }

#chat-msgs {
  overflow-y:auto; padding:8px 10px;
  display:flex; flex-direction:column; gap:3px;
  -webkit-overflow-scrolling:touch;
  max-height: calc(34vh - 44px);
}
.cmsg { font-family:'VT323',monospace; font-size:14px; line-height:1.3; word-break:break-word; }
.cmsg .cname { color:var(--cyan); }
.cmsg.sys { color:var(--dim); font-style:italic; font-size:12px; }
.chat-ir { display:flex; border-top:2px solid var(--bg3); flex-shrink:0; }
.chat-ir input {
  flex:1; background:transparent; border:none;
  color:var(--yel); font-family:'VT323',monospace; font-size:15px;
  padding:8px 10px; outline:none; -webkit-appearance:none;
  -webkit-user-select:text; user-select:text;
}
.chat-ir button {
  background:var(--bg3); border:none; border-left:2px solid var(--bg3);
  color:var(--cyan); font-family:'VT323',monospace;
  font-size:18px; padding:8px 12px; cursor:pointer; touch-action:manipulation;
}

/* ════ HAND AREA ════ */
.hand-area {
  flex-shrink: 0;
  background: rgba(0,0,0,.55);
  border-top: 2px solid var(--neon);
  padding: 8px 10px;
  padding-bottom: max(env(safe-area-inset-bottom, 0px), 10px);
  position: relative; z-index: 5;
}
.hand-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; }
.hand-ttl { font-size:7px; color:var(--neon); text-shadow:0 0 5px var(--neon); letter-spacing:2px; }
.hand-cnt { font-family:'VT323',monospace; font-size:13px; color:var(--dim); }
.hand-hint { font-family:'VT323',monospace; font-size:11px; color:var(--dim); text-align:center; margin-bottom:7px; letter-spacing:1px; }

.h-scroll {
  display: flex; gap: 7px;
  overflow-x: auto;
  padding: 4px 2px 8px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  min-height: 108px;
  flex-wrap: wrap;
}
.h-scroll::-webkit-scrollbar { display: none; }

/* ════ CARDS ════ */
.card {
  flex-shrink: 0;
  width: 60px; height: 90px;
  background: var(--cf);
  border: 2px solid #c0a060;
  box-shadow: 3px 3px 0 rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.5);
  position: relative;
  display: flex; flex-direction: column; align-items: stretch; padding: 3px;
  /* Mobile tap essentials */
  cursor: pointer;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  pointer-events: auto;
}
.card::before { content:''; position:absolute; inset:2px; border:1px solid rgba(192,160,96,.25); pointer-events:none; }

.card.pressing {
  transform: translateY(-6px) scale(1.04);
  box-shadow: 2px 2px 0 rgba(0,0,0,.8), 0 0 0 2px var(--yel), 0 0 10px rgba(255,230,0,.3);
  z-index: 40;
}

.card.done {
  filter: grayscale(100%) brightness(0.42);
  border-color: #555;
  box-shadow: 2px 2px 0 rgba(0,0,0,.5);
}
.card.done.pressing {
  filter: grayscale(100%) brightness(0.58);
  transform: translateY(-4px);
}

.c-done-lbl {
  display: none; position: absolute; bottom: 3px; left: 0; right: 0;
  text-align: center; font-family:'Press Start 2P',monospace;
  font-size: 5px; color: rgba(180,180,220,.75); letter-spacing: 1px;
  pointer-events: none;
}
.card.done .c-done-lbl { display: block; }

.c-tl { display:flex; flex-direction:column; align-items:center; line-height:1; }
.c-br { display:flex; flex-direction:column; align-items:center; line-height:1; transform:rotate(180deg); align-self:flex-end; }
.c-rank { font-family:'Press Start 2P',monospace; font-size:9px; line-height:1; color:inherit; }
.c-suit-sm { font-size:8px; line-height:1; margin-top:1px; }
.c-cs { font-size:23px; line-height:1; position:absolute; top:50%; left:50%; transform:translate(-50%,-54%); pointer-events:none; }
.card.red   { color: var(--red); }
.card.black { color: #1a1030; }

@keyframes cardIn {
  from { transform:translateY(40px) scale(.85) rotate(4deg); opacity:0; }
  to   { transform:none; opacity:1; }
}
.card.new { animation: cardIn .25s cubic-bezier(0.34,1.56,0.64,1) both; }

/* ════ TOASTS ════ */
#toasts {
  position:fixed; top:56px; left:50%; transform:translateX(-50%);
  z-index:1000; display:flex; flex-direction:column; gap:6px;
  pointer-events:none; width:90%; max-width:320px; align-items:center;
}
.toast {
  background:var(--bg2); border:2px solid var(--cyan);
  box-shadow:3px 3px 0 rgba(0,0,0,.8);
  padding:10px 14px; font-size:7px; letter-spacing:1px;
  width:100%; text-align:center;
  animation:tIn .2s ease, tOut .3s ease 2.7s forwards;
}
.toast.err { border-color:var(--red); color:var(--red2); }
.toast.win { border-color:var(--yel); color:var(--yel); }
@keyframes tIn  { from{opacity:0;transform:translateY(-8px);} }
@keyframes tOut { to{opacity:0;transform:translateY(-8px);} }

/* ════ WIN ════ */
#win-ov {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:800;
  align-items:center; justify-content:center; flex-direction:column; gap:22px;
  text-align:center; padding:24px;
}
#win-ov.show { display:flex; }
.win-ttl {
  font-size:clamp(18px,7vw,46px); color:var(--yel);
  text-shadow:0 0 20px var(--yel), 4px 4px 0 #805000; letter-spacing:3px;
  animation:wb .4s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes wb { from{transform:scale(.3);opacity:0;} }
.win-sub { font-family:'VT323',monospace; font-size:22px; color:var(--neon); letter-spacing:2px; }
.cf { position:fixed; pointer-events:none; animation:cff linear forwards; z-index:900; }
@keyframes cff{0%{transform:translateY(-20px) rotate(0);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}
</style>
</head>
<body>

<!-- ═════ LOBBY ═════ -->
<div id="s-lobby" class="scr on">
  <div class="logo">
    <div class="logo-ttl">Poker</div>
    <div class="logo-suits">♠ ♥ ♦ ♣</div>
    <div class="logo-sub">— Kalabaw —</div>
  </div>
  <div class="panel">
    <span class="lbl">▶ YOUR NAME</span>
    <input class="inp" id="inp-name" placeholder="ENTER NAME..." maxlength="18"
           type="text" inputmode="text"
           autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">

    <button class="btn btn-y" id="btn-host">⚡ HOST NEW GAME</button>

    <div class="hdiv">— OR JOIN —</div>

    <span class="lbl">▶ ROOM CODE</span>
    <input class="inp code" id="inp-code" placeholder="ENTER CODE" maxlength="5"
           type="text" inputmode="text"
           autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">

    <button class="btn btn-c" id="btn-join">→ JOIN GAME</button>

    <div class="conn-row">
      <span class="dot" id="ldot"></span>
      <span id="lstat">CONNECTING...</span>
    </div>
  </div>
</div>

<!-- ═════ WAITING ═════ -->
<div id="s-wait" class="scr">
  <div class="w-panel">
    <div class="stitle">◈ WAITING ROOM</div>

    <div class="code-box">
      <div class="code-lbl">▶ SHARE THIS CODE WITH FRIENDS</div>
      <div class="code-val" id="disp-code">-----</div>
    </div>

    <div class="stitle">▶ PLAYERS</div>
    <div id="wait-list"></div>

    <div id="host-area" style="display:none;margin-top:12px;">
      <button class="btn btn-n" id="btn-start">▶▶ START GAME</button>
      <div style="font-family:'VT323',monospace;font-size:13px;color:var(--dim);text-align:center;margin-top:4px;">MIN 2 PLAYERS</div>
    </div>
    <div id="guest-msg" style="display:none;font-family:'VT323',monospace;font-size:15px;color:var(--dim);text-align:center;margin-top:12px;letter-spacing:1px;">
      WAITING FOR HOST...
    </div>

    <div style="margin-top:14px;">
      <button class="btn btn-r" id="btn-leave-wait">← BACK / LEAVE ROOM</button>
    </div>
  </div>
</div>

<!-- ═════ GAME ═════ -->
<div id="s-game" class="scr">

  <div class="g-hdr">
    <div class="g-ttl">SEVENS</div>
    <div class="g-right">
      <span class="dot on" id="gdot"></span>
      <span class="pill">🂠 <span id="dleft">52</span></span>
    </div>
  </div>

  <!-- Other players — only total card count visible -->
  <div class="opp-strip" id="opp-strip"></div>

  <!-- Deck + Actions -->
  <div class="t-center">
    <div class="deck-wrap" id="deck-wrap">
      <div id="deck-el" class="deck-stack">
        <div class="dss"></div><div class="dsm"></div>
        <div class="dst">
          <div class="deck-inner">🂠</div>
          <div class="deck-badge" id="deck-badge">52</div>
        </div>
      </div>
      <div class="deck-lbl">[ TAP TO DRAW ]</div>
    </div>

    <div class="act-btns">
      <button class="abtn abtn-win" id="btn-win">🏆 WIN</button>
      <button class="abtn abtn-exit" id="btn-exit">✕ EXIT</button>
    </div>
  </div>

  <!-- Chat — inline between table and hand so it NEVER covers cards -->
  <div id="chat-bar">
    <div class="chat-hdr" id="chat-hdr">
      💬 CHAT <span id="chat-unread" style="color:var(--yel);"></span>
      <span id="chat-tog">▲</span>
    </div>
    <div class="chat-body" id="chat-body">
      <div id="chat-msgs"></div>
      <div class="chat-ir">
        <input id="chat-in" placeholder="MESSAGE..." maxlength="200"
               type="text" inputmode="text"
               autocomplete="off" autocorrect="off" spellcheck="false">
        <button id="chat-send">▲</button>
      </div>
    </div>
  </div>

  <!-- Your hand -->
  <div class="hand-area">
    <div class="hand-hdr">
      <div class="hand-ttl" id="hand-ttl">YOUR HAND</div>
      <div class="hand-cnt" id="hand-cnt">0A · 0D</div>
    </div>
    <div class="hand-hint">TAP CARD = DONE &nbsp;·&nbsp; TAP AGAIN = UNDO</div>
    <div class="h-scroll" id="h-scroll"></div>
  </div>
</div>

<!-- Toasts -->
<div id="toasts"></div>

<!-- Win overlay -->
<div id="win-ov">
  <div class="win-ttl" id="win-ttl">🏆 VICTORY!</div>
  <div class="win-sub"  id="win-sub">YOU WON!</div>
  <button class="btn btn-c btn-sm" style="margin-top:8px;" onclick="location.reload()">▶ PLAY AGAIN</button>
</div>

<script>
// ── STATE ────────────────────────────────────────────────
const SK = 'sevens_v4';
let ws = null, myId = null, roomCode = null, gameState = null;
let chatOpen = false, unread = 0;
const cardEls = new Map();  // cardId → DOM element

// ── SESSION ──────────────────────────────────────────────
function saveSession(id, code) {
  try { localStorage.setItem(SK, JSON.stringify({id, code, t: Date.now()})); } catch{}
}
function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SK) || 'null');
    if (!s || Date.now() - s.t > 3*60*60*1000) { clearSession(); return null; }
    return s;
  } catch { return null; }
}
function clearSession() { try { localStorage.removeItem(SK); } catch{} }

// ── WEBSOCKET ────────────────────────────────────────────
function connect() {
  try { const protocol = location.protocol === "https:" ? "wss" : "ws";
ws = new WebSocket(`${protocol}://${location.host}`); } catch { setTimeout(connect, 2000); return; }
  ws.onopen = () => {
    setDot(true);
    const s = loadSession();
    if (s) send({ type: 'reconnect', savedPlayerId: s.id, savedRoomCode: s.code });
  };
  ws.onclose = () => { setDot(false); setTimeout(connect, 2000); };
  ws.onerror = () => {};
  ws.onmessage = (e) => { try { handle(JSON.parse(e.data)); } catch(err) { console.error(err); } };
}
function send(d) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(d)); }
function setDot(on) {
  document.getElementById('ldot').classList.toggle('on', on);
  document.getElementById('lstat').textContent = on ? 'CONNECTED' : 'RECONNECTING...';
  document.getElementById('gdot').classList.toggle('on', on);
}

// ── MESSAGES ─────────────────────────────────────────────
function handle(msg) {
  switch (msg.type) {
    case 'connected':
      myId = msg.playerId; break;
    case 'reconnect_failed':
      clearSession(); go('s-lobby'); break;
    case 'reconnected':
      myId = msg.playerId; roomCode = msg.state.code;
      saveSession(myId, roomCode);
      if (msg.gameStarted) { go('s-game'); renderGame(msg.state); showChat(); sysMsg('Reconnected!'); }
      else { go('s-wait'); renderWaiting(msg.state); }
      break;
    case 'room_created':
    case 'room_joined':
      myId = msg.playerId; roomCode = msg.code;
      saveSession(myId, roomCode);
      document.getElementById('disp-code').textContent = msg.code;
      go('s-wait'); renderWaiting(msg.state); break;
    case 'error':
      toast(msg.message, 'err'); break;
    case 'game_started':
      go('s-game'); renderGame(msg.state); showChat();
      sysMsg('Game on! Tap a card to mark DONE. Tap again to undo.'); break;
    case 'state_update':
      if (cur() === 's-game') renderGame(msg.state);
      else renderWaiting(msg.state);
      break;
    case 'player_won':
      renderGame(msg.state); showWin(msg.winnerName, msg.isYou); break;
    case 'sys':
      sysMsg(msg.text); break;
    case 'chat':
      addChat(msg.name, msg.text, msg.fromId === myId); break;
  }
}

// ── SCREENS ──────────────────────────────────────────────
function go(id) {
  document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function cur() { const el = document.querySelector('.scr.on'); return el ? el.id : null; }

// ── LOBBY ────────────────────────────────────────────────
function getName() { return (document.getElementById('inp-name').value.trim() || 'PLAYER').substring(0,18); }

document.getElementById('btn-host').addEventListener('click', () => send({ type:'create_room', name:getName() }));
document.getElementById('btn-join').addEventListener('click', doJoin);
document.getElementById('inp-code').addEventListener('input', function() { this.value = this.value.toUpperCase(); });
document.getElementById('inp-code').addEventListener('keydown', e => { if (e.key==='Enter') doJoin(); });
document.getElementById('inp-name').addEventListener('keydown', e => { if (e.key==='Enter') send({type:'create_room',name:getName()}); });

function doJoin() {
  const code = document.getElementById('inp-code').value.trim().toUpperCase();
  if (!code) { toast('ENTER A ROOM CODE', 'err'); return; }
  send({ type:'join_room', name:getName(), code });
}

// ── WAITING ──────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', () => send({type:'start_game'}));
document.getElementById('btn-leave-wait').addEventListener('click', doLeave);

function renderWaiting(state) {
  document.getElementById('disp-code').textContent = state.code;
  const list = document.getElementById('wait-list');
  list.innerHTML = '';
  for (const p of state.players) {
    const d = document.createElement('div');
    d.className = 'p-row' + (p.connected ? ' on' : '');
    d.innerHTML =
      `<span class="pdot${p.connected?' on':''}"></span>` +
      `<span style="font-family:'VT323',monospace;font-size:16px;">${esc(p.name)}` +
      (p.isYou ? ` <span style="color:var(--yel)">(YOU)</span>` : '') +
      `</span>` +
      (p.id===state.hostId ? `<span class="htag">HOST</span>` : '');
    list.appendChild(d);
  }
  const isHost = state.hostId === myId;
  document.getElementById('host-area').style.display = isHost ? 'block' : 'none';
  document.getElementById('guest-msg').style.display  = isHost ? 'none'  : 'block';
}

// ── LEAVE ────────────────────────────────────────────────
function doLeave() {
  clearSession();
  cardEls.clear();
  roomCode = null; gameState = null;
  document.getElementById('h-scroll').innerHTML = '';
  document.getElementById('chat-msgs').innerHTML = '';
  document.getElementById('chat-bar').classList.remove('show');
  document.getElementById('chat-body').classList.remove('open');
  chatOpen = false;
  go('s-lobby');
  if (ws) { ws.close(); }
}

// ── GAME RENDER ──────────────────────────────────────────
function renderGame(state) {
  gameState = state;

  // Deck
  const n = state.deckCount;
  document.getElementById('dleft').textContent = n;
  const de = document.getElementById('deck-el');
  if (n > 0) {
    de.className = 'deck-stack';
    de.innerHTML = `<div class="dss"></div><div class="dsm"></div><div class="dst"><div class="deck-inner">🂠</div><div class="deck-badge">${n}</div></div>`;
  } else {
    de.className = 'deck-empty-box';
    de.innerHTML = `<span>EMPTY</span>`;
  }

  // Opponents — show only total card count, all face-down pips
  const strip = document.getElementById('opp-strip');
  strip.innerHTML = '';
  for (const p of state.players) {
    if (p.isYou) continue;
    const total = p.handCount + p.doneCount;
    let pips = '';
    for (let i = 0; i < Math.min(total, 14); i++) pips += `<div class="pip"></div>`;
    const b = document.createElement('div');
    b.className = 'opp-block' + (p.connected ? '' : ' disc');
    b.innerHTML =
      `<div class="opp-nm">${esc(p.name)}</div>` +
      `<div class="opp-pips">${pips}</div>` +
      `<div class="opp-num">${total} CARD${total!==1?'S':''}</div>`;
    strip.appendChild(b);
  }

  // Your hand
  const me = state.players.find(p => p.isYou);
  if (me) {
    const a = (me.hand||[]).length;
    const d = (me.doneCards||[]).length;
    document.getElementById('hand-ttl').textContent = esc(me.name).toUpperCase();
    document.getElementById('hand-cnt').textContent = `${a}A · ${d}D`;
    syncHand(me.hand||[], me.doneCards||[]);
  }
}

// ── SYNC HAND ────────────────────────────────────────────
function syncHand(hand, done) {
  const scroll = document.getElementById('h-scroll');
  const all = [
    ...hand.map(c => ({...c, isDone:false})),
    ...done.map(c => ({...c, isDone:true})),
  ];
  const wantedIds = new Set(all.map(c => c.id));

  // Remove cards no longer in hand
  for (const [id, el] of cardEls) {
    if (!wantedIds.has(id)) { el.remove(); cardEls.delete(id); }
  }

  const suits = {S:'♠', H:'♥', D:'♦', C:'♣'};

  for (const card of all) {
    const isRed = card.suit==='H' || card.suit==='D';
    const sc = suits[card.suit] || card.suit;
    let el = cardEls.get(card.id);

    if (!el) {
      el = document.createElement('div');
      el.className = `card ${isRed?'red':'black'} new`;
      el.innerHTML =
        `<div class="c-tl"><div class="c-rank">${card.value}</div><div class="c-suit-sm">${sc}</div></div>` +
        `<div class="c-cs">${sc}</div>` +
        `<div class="c-br"><div class="c-rank">${card.value}</div><div class="c-suit-sm">${sc}</div></div>` +
        `<div class="c-done-lbl">DONE</div>`;

      // ─ Mobile touch handling (no 300ms delay) ─
      let sx = 0, sy = 0, moved = false;
      el.addEventListener('touchstart', (e) => {
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
        moved = false;
        el.classList.add('pressing');
      }, {passive:true});
      el.addEventListener('touchmove', (e) => {
        if (Math.abs(e.touches[0].clientX-sx) > 8 || Math.abs(e.touches[0].clientY-sy) > 8) {
          moved = true;
          el.classList.remove('pressing');
        }
      }, {passive:true});
      el.addEventListener('touchend', (e) => {
        el.classList.remove('pressing');
        if (!moved) {
          e.preventDefault(); // stop ghost click
          doToggleDone(card.id);
        }
      }, {passive:false});
      // Desktop
      el.addEventListener('click', () => doToggleDone(card.id));

      setTimeout(() => el.classList.remove('new'), 300);
      cardEls.set(card.id, el);
      scroll.appendChild(el);
    }

    el.classList.toggle('done', card.isDone);
  }

  // Re-order DOM: active first, done last
  for (const card of all) {
    const el = cardEls.get(card.id);
    if (el) scroll.appendChild(el);
  }
}

// ── ACTIONS ──────────────────────────────────────────────
document.getElementById('deck-wrap').addEventListener('click', doDraw);
function doDraw() {
  if (!gameState || gameState.deckCount===0) { toast('DECK IS EMPTY!','err'); return; }
  send({type:'draw_card'});
}
function doToggleDone(cardId) { send({type:'toggle_done', cardId}); }

document.getElementById('btn-win').addEventListener('click', () => {
  if (!confirm('Declare yourself the winner?')) return;
  send({type:'declare_win'});
});
document.getElementById('btn-exit').addEventListener('click', doLeave);

// ── WIN ──────────────────────────────────────────────────
function showWin(name, isMe) {
  document.getElementById('win-ttl').textContent = isMe ? '🏆 VICTORY!' : '💀 GAME OVER';
  document.getElementById('win-sub').textContent  = isMe ? 'YOU WON!' : `${name.toUpperCase()} WON!`;
  document.getElementById('win-ov').classList.add('show');
  if (isMe) confetti();
}
function confetti() {
  const cols = ['#ffe600','#ff6ac1','#00f5ff','#39ff14','#ff3131'];
  for (let i=0;i<50;i++) setTimeout(() => {
    const el = document.createElement('div');
    el.className = 'cf';
    const sz = 5 + Math.random()*7;
    el.style.cssText = `left:${Math.random()*100}vw;top:-10px;width:${sz}px;height:${sz}px;background:${cols[~~(Math.random()*cols.length)]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.5}s;`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }, Math.random()*600);
}

// ── CHAT ─────────────────────────────────────────────────
function showChat() { document.getElementById('chat-bar').classList.add('show'); }

document.getElementById('chat-hdr').addEventListener('click', toggleChat);
document.getElementById('chat-send').addEventListener('click', doChat);
document.getElementById('chat-in').addEventListener('keydown', e => {
  if (e.key==='Enter') { e.preventDefault(); doChat(); }
});

function toggleChat() {
  chatOpen = !chatOpen;
  document.getElementById('chat-body').classList.toggle('open', chatOpen);
  document.getElementById('chat-tog').textContent = chatOpen ? '▼' : '▲';
  if (chatOpen) {
    unread = 0;
    document.getElementById('chat-unread').textContent = '';
    document.getElementById('chat-msgs').scrollTop = 99999;
  }
}
function addChat(name, text, isMe) {
  const el = document.createElement('div');
  el.className = 'cmsg';
  el.innerHTML = `<span class="cname">${esc(name)}${isMe?' (YOU)':''}:</span> ${esc(text)}`;
  pushChat(el);
  if (!chatOpen) {
    unread++;
    document.getElementById('chat-unread').textContent = ` (${unread})`;
  }
}
function sysMsg(text) {
  const el = document.createElement('div');
  el.className = 'cmsg sys';
  el.textContent = `— ${text} —`;
  pushChat(el);
}
function pushChat(el) {
  const box = document.getElementById('chat-msgs');
  box.appendChild(el);
  if (chatOpen) box.scrollTop = box.scrollHeight;
}
function doChat() {
  const inp = document.getElementById('chat-in');
  const t = inp.value.trim();
  if (!t) return;
  send({type:'chat',text:t});
  inp.value = '';
}

// ── TOAST ────────────────────────────────────────────────
function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3100);
}

// ── UTILS ────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── INIT ─────────────────────────────────────────────────
connect();
</script>
</body>
</html>
